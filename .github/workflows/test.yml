name: Native core and offline integrations
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Locked installation
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Bootstrap core in project virtual environment
        shell: python
        run: |
          import subprocess, sys
          result = subprocess.run([sys.executable, "tools/bootstrap.py", "--skip-tools"])
          assert result.returncode in (0, 2), result.returncode
      - name: Verified native Gitleaks and passive-tool version checks
        run: python tools/install_tools.py --tool gitleaks --tool subfinder --tool urlfinder
      - name: Core and real offline integration tests
        env:
          RECONMAP_TEST_GITLEAKS: .tools/bin/gitleaks${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python -m pytest -q
      - name: CLI smoke and deterministic offline demonstration
        run: |
          reconmap --version
          reconmap plan example.com --quick --json
          reconmap plan example.com --all-tool --json
          reconmap plan example.com --god-mode --json
          reconmap settings --set progress false
          reconmap doctor --json
          reconmap doctor --tool gitleaks=.tools/bin/gitleaks${{ runner.os == 'Windows' && '.exe' || '' }} --tool subfinder=.tools/bin/subfinder${{ runner.os == 'Windows' && '.exe' || '' }} --tool urlfinder=.tools/bin/urlfinder${{ runner.os == 'Windows' && '.exe' || '' }}
          reconmap demo --output-root demo-output
          reconmap resume demo-output/example.com --no-progress
          reconmap report --run demo-output/example.com
          reconmap tools list
          reconmap plan --target example.com --config examples/scope.yaml --tools all --enrich all --json
          reconmap demo --output-root v2-demo-output --enrich tech,dedup,priority
          reconmap rerun --from v2-demo-output/example.com --modules analysis --mode offline --enrich tech,dedup,priority
          reconmap report --run v2-demo-output/1_example.com
      - name: God Mode fixtures and preserved discovery allocation
        shell: python
        run: |
          import json, pathlib, subprocess, sys
          result = subprocess.run([sys.executable, "-m", "reconmap", "scan", "example.com", "--god-mode", "--mode", "demo", "--output-root", "god-demo-output", "--no-progress"])
          assert result.returncode == 2, result.returncode  # Explicit optional/policy limitations
          run = pathlib.Path("god-demo-output/example.com")
          before = json.loads((run/"manifest.json").read_text())["requests"]
          resumed = subprocess.run([sys.executable, "-m", "reconmap", "resume", str(run), "--no-progress"])
          assert resumed.returncode == 2
          assert json.loads((run/"manifest.json").read_text())["requests"] == before
          coverage = json.loads((run/"reports/coverage.json").read_text())
          assert coverage["discovery"]["requests"] <= coverage["discovery"]["request_cap"]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-${{ matrix.os }}-${{ matrix.python }}
          path: |
            demo-output/
            v2-demo-output/
            god-demo-output/
