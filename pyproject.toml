[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "reconmap-local"
version = "3.1.1"
description = "Explicitly scoped reconnaissance with local, resumable evidence and offline reports"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.11,<4", "pydantic>=2.10,<3", "PyYAML>=6.0.2,<7", "tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.25,<0.26", "dnspython>=2.7,<3"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
reconmap = "reconmap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reconmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
